[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drgrade"
version = "1.0.0"
description = "Diabetic-retinopathy grading pipeline: image quality, vessel and lesion segmentation, an ordinal ConvNeXt-Tiny + CORN grader, uncertainty and explanations"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "tensorflow==2.21.0",
    "keras==3.15.1",
    "torch==2.14.0",
    "torchvision==0.29.0",
    "segmentation-models-pytorch==0.5.0",
    "timm==1.0.30",
    "numpy==2.4.6",
    "scipy==1.17.1",
    "scikit-image==0.26.0",
    "scikit-learn==1.9.0",
    "opencv-python-headless==5.0.0.93",
    "pandas==3.0.5",
    "matplotlib==3.11.1",
    "Pillow==12.3.0",
    "h5py==3.14.0",
    "PyYAML==6.0.3",
]

[project.optional-dependencies]
train = ["huggingface_hub==2.0.0", "safetensors==0.8.0"]
test = ["pytest==9.1.1"]

[tool.setuptools]
packages = ["drgrade"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
